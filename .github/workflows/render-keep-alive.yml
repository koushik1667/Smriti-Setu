name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes (Render free tier spins down after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual one-click wake-up check from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping PharmaVision Backend API
        run: |
          URL="https://pharmavision-backend.onrender.com/api/health"
          echo "Sending keep-alive health check to: $URL at $(date -u)"
          
          # Perform curl with retry and latency measurement
          HTTP_RESPONSE=$(curl -s -o response.json -w "%{http_code} Latency: %{time_total}s" --max-time 45 "$URL" || echo "FAILED")
          
          echo "Response code & latency: $HTTP_RESPONSE"
          
          if [ -f response.json ]; then
            echo "Health check payload:"
            cat response.json
          fi
