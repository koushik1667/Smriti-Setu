services:
  # ----------------------------------------------------
  # 1. Backend Web Service (Node.js API)
  # ----------------------------------------------------
  - type: web
    name: pharmavision-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ----------------------------------------------------
  # 2. Frontend Static Site (Vite React App)
  # ----------------------------------------------------
  - type: web
    name: pharmavision-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pharmavision-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
